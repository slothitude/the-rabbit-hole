<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Guide to the Rabbit Hole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Mono', 'SF Mono', 'Cascadia Code', monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .poster-wrap {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .poster-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(200, 255, 0, 0.08), 0 0 120px rgba(0, 255, 136, 0.04);
        }

        .enter-btn {
            position: absolute;
            bottom: 33%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.9rem 2.8rem;
            background: rgba(200, 255, 0, 0.12);
            border: 2px solid #c8ff00;
            color: #c8ff00;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            border-radius: 4px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2;
        }
        .enter-btn:hover {
            background: #c8ff00;
            color: #0d1117;
            box-shadow: 0 0 40px rgba(200, 255, 0, 0.4);
            text-decoration: none;
        }

        .quote {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: #484f58;
            font-style: italic;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .enter-btn {
                font-size: 0.8rem;
                padding: 0.7rem 1.8rem;
                letter-spacing: 2px;
                bottom: 10%;
            }
        }
    </style>
</head>
<body>
    <div class="poster-wrap">
        <img src="{{ prefix }}/static/title_page.jpg" alt="The Guide to the Rabbit Hole">
        <a href="{{ prefix }}/home" class="enter-btn">ENTER THE HOLE</a>
    </div>

    <div class="quote">"In the beginning the Universe was created. This has made a lot of people very angry."</div>
</body>
</html>
